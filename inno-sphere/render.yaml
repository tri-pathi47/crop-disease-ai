services:
  - type: web
    name: inno-sphere-api
    runtime: python
    rootDir: backend
    buildCommand: python -m pip install --only-binary=:all: -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://inno-sphere-web.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PIP_ONLY_BINARY
        value: ":all:"
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CNN_MODEL_PATH
        sync: false
      - key: CNN_LABELS_PATH
        sync: false
      - key: YOLO_MODEL_PATH
        sync: false
      - key: PYTORCH_MODEL_PATH
        sync: false
      - key: PYTORCH_LABELS_PATH
        sync: false
      - key: VISION_DEVICE
        value: cpu
      - key: OPENWEATHER_API_KEY
        sync: false

  - type: static
    name: inno-sphere-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://crop-disease-ai-hojt.onrender.com