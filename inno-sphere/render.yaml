services:
  - type: web
    name: inno-sphere-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PIP_ONLY_BINARY
        value: ":all:"
      - key: JWT_SECRET
        sync: false

  - type: web
    name: inno-sphere-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false