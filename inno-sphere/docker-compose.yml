services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: inno
      POSTGRES_PASSWORD: inno
      POSTGRES_DB: innosphere
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inno -d innosphere"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://inno:inno@db:5432/innosphere
      UPLOAD_DIR: /srv/uploads
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/srv/app
      - uploads:/srv/uploads
    depends_on:
      db: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [api]

volumes:
  pgdata:
  uploads:
